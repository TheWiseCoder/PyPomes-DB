[build-system]
requires = [
    "hatchling>=1.32.4"
]
build-backend = "hatchling.build"

[project]
name = "pypomes_db"
version = "3.2.3"
authors = [
  { name="GT Nunes", email="wisecoder01@gmail.com" }
]
description = "A collection of Python pomes, penyeach (database modules)"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "pypomes-core>=3.3.1",
#   "google-cloud-spanner>=3.71.0",
#   "mysql-connector-python>=26.7.0",
#   "oracledb>=26.0.1",
#   "psycopg2-binary>=2.9.13",
#   "pyodbc>=5.3.0"
]
[project.urls]
"Homepage" = "https://github.com/TheWiseCoder/PyPomes-DB"
"Bug Tracker" = "https://github.com/TheWiseCoder/PyPomes-DB/issues"
